name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Create android folder
        run: flutter create . --platforms=android --org com.phonepe --project-name fake_phonepe

      - name: Fix label
        run: sed -i 's/android:label="[^"]*"/android:label="PhonePe"/' android/app/src/main/AndroidManifest.xml

      - name: Pub get
        run: flutter pub get

      - name: Remove asset refs (temporary)
        run: sed -i '/assets\//d' pubspec.yaml

      - name: Build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: phonepe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
